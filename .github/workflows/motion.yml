name: motion daily
on:
  schedule:
    - cron: "17 7 * * *"   # every day, 08:17 Lagos time
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collect today's numbers
        working-directory: motion/collector
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ENABLE_WEB_SCRAPE: ${{ vars.ENABLE_WEB_SCRAPE || '1' }}
        run: python collect.py
      - name: Commit data
        run: |
          git config user.name "ug-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add motion/data motion/artists.json
          git diff --cached --quiet || git commit -m "ug-tracker: data for $(date -u +%F)"
          git push
